<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Studio Pro — Hardware Showcase</title>
  <style>
    :root {
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      --font-mono: "SF Mono", "Menlo", monospace;

      --color-canvas: #000000;
      --color-surface-raised: #1c1c1e;
      --color-surface-glass: rgba(28, 28, 30, 0.72);
      --color-text-primary: #f5f5f7;
      --color-text-secondary: #86868b;
      --color-border-subtle: rgba(255, 255, 255, 0.12);
      --color-border-focus: oklch(0.62 0.22 255);
      --color-accent: oklch(0.48 0.24 255);
      --color-eyebrow: oklch(0.72 0.18 255);

      --radius-outer: 24px;
      --radius-inner: max(0px, 24px - 1px - 8px); /* 15px concentric squircle */
      --radius-pill: 9999px;
      --hit-target-min: 44px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      line-height: 1.28;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .hero-card {
      background: var(--color-surface-glass);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-outer);
      padding: 48px;
      max-width: 680px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      /* Perceptual modern gradient */
      background-image: linear-gradient(in oklab, rgba(28, 28, 30, 0.85) 0%, rgba(20, 20, 22, 0.95) 100%);
    }

    h1 {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.022em;
    }

    p {
      color: var(--color-text-secondary);
      font-size: 16px;
      line-height: 1.65;
      max-width: 480px;
    }

    .pill-btn-container {
      min-height: var(--hit-target-min);
      min-width: var(--hit-target-min);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      outline: none;
    }

    .pill-btn-container .visual-surface {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      background: var(--color-accent);
      color: #ffffff;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 500;
      transition: background 240ms cubic-bezier(0.16, 1, 0.3, 1),
                  transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill-btn-container:hover .visual-surface {
      background: oklch(0.64 0.22 255);
    }

    .pill-btn-container:active .visual-surface {
      transform: scale(0.98); /* Controlled area-proportional scale */
    }

    /* Hard Invariant MD001: Focus Ring */
    .pill-btn-container:focus-visible {
      outline: 2px solid var(--color-border-focus);
      outline-offset: 3px;
    }

    /* Hard Invariant MD002: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="hero-card">
    <span style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-eyebrow);">Now Available</span>
    <h1>Studio Display Pro</h1>
    <p>Retina 5K display with 600 nits of brightness, P3 wide color gamut, and support for 1 billion colors. Engineered for ultimate creative workflows.</p>
    <button class="pill-btn-container" type="button" aria-label="Order Studio Display Pro">
      <span class="visual-surface">Order Now</span>
    </button>
  </main>
</body>
</html>
