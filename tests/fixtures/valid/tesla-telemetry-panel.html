<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla Cybertruck — Powertrain Telemetry</title>
  <style>
    :root {
      --font-display: "Space Grotesk", "Inter", sans-serif;
      --font-sans: "Inter", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;

      --color-canvas: #050505;
      --color-surface-raised: #111111;
      --color-text-primary: #ffffff;
      --color-text-secondary: #8e8e93;
      --color-border-subtle: rgba(255, 255, 255, 0.08);
      --color-border-focus: oklch(0.65 0.24 28);
      --color-accent: oklch(0.58 0.24 28);
      --color-status-info: oklch(0.78 0.15 200);

      --radius-outer: 4px;
      --radius-inner: max(0px, 4px - 1px - 1px);
      --hit-target-min: 44px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      line-height: 1.22;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .telemetry-header {
      background: linear-gradient(in oklch shorter hue, #111111 0%, #1a1a1a 100%);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-outer);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: -0.015em;
      text-transform: uppercase;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-flow: row;
      gap: 16px;
    }

    .panel {
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-outer);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .metric-value {
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }

    .metric-unit {
      font-size: 13px;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tesla-btn-container {
      min-height: var(--hit-target-min);
      min-width: var(--hit-target-min);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      outline: none;
      margin-top: 12px;
    }

    .tesla-btn-container .visual-surface {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      background: var(--color-accent);
      color: #ffffff;
      border-radius: var(--radius-inner);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 100ms cubic-bezier(0.2, 0, 0, 1),
                  transform 100ms cubic-bezier(0.2, 0, 0, 1);
    }

    .tesla-btn-container:hover .visual-surface {
      background: oklch(0.64 0.24 28);
    }

    .tesla-btn-container:active .visual-surface {
      transform: scale(0.98);
    }

    /* Hard Invariant MD001: Focus Ring */
    .tesla-btn-container:focus-visible {
      outline: 2px solid var(--color-border-focus);
      outline-offset: 2px;
    }

    /* Hard Invariant MD002: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="telemetry-header">
    <h1>CYBERTRUCK TRI-MOTOR POWERTRAIN</h1>
    <span style="font-family: var(--font-mono); font-size: 13px; color: var(--color-status-info);">BEAST MODE ACTIVE</span>
  </header>

  <main class="telemetry-grid">
    <div class="panel">
      <span class="metric-unit">Rear Inverter Temp</span>
      <div class="metric-value">42.8°C</div>
    </div>
    <div class="panel">
      <span class="metric-unit">Battery Pack Voltage</span>
      <div class="metric-value">814.2V</div>
    </div>
    <div class="panel">
      <span class="metric-unit">Peak Torque</span>
      <div class="metric-value">10,296 Nm</div>
      <button class="tesla-btn-container" type="button" aria-label="Engage Torque Vectoring">
        <span class="visual-surface">Engage Differential</span>
      </button>
    </div>
  </main>
</body>
</html>
