<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="mapGlow" cx="60%" cy="40%" r="55%" fx="60%" fy="40%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="630" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Left Content Column -->
  <g transform="translate(48, 48)">
    <!-- Badges -->
    <rect x="0" y="0" width="108" height="26" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="10" y="17" fill="#f59e0b" class="font-mono" font-size="11" font-weight="600">ARCHETYPE 32</text>

    <rect x="118" y="0" width="168" height="26" rx="4" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="128" y="17" fill="#cbd5e1" class="font-mono" font-size="11">WGS84 UTM Zone 47N</text>

    <!-- Headline -->
    <text x="0" y="80" fill="#f8fafc" class="font-sans" font-size="36" font-weight="800" letter-spacing="-0.03em">
      <tspan x="0" dy="0">Geospatial Situation</tspan>
      <tspan x="0" dy="44">Awareness Platform</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#cbd5e1" class="font-sans" font-size="14" font-weight="500">
      <tspan x="0" dy="0">High-precision cadastral parcel boundaries, satellite</tspan>
      <tspan x="0" dy="22">telemetry integration, and legal boundary provenance tracking.</tspan>
    </text>

    <!-- Telemetry Cards 2x2 Grid -->
    <!-- Card 1 -->
    <g transform="translate(0, 240)">
      <rect width="210" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="24" fill="#cbd5e1" class="font-mono" font-size="10" font-weight="600">ACTIVE PARCEL BLOCK</text>
      <text x="14" y="48" fill="#f8fafc" class="font-mono" font-size="17" font-weight="600">Block 42-B</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(222, 240)">
      <rect width="210" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="24" fill="#cbd5e1" class="font-mono" font-size="10" font-weight="600">SURVEYED AREA</text>
      <text x="14" y="48" fill="#f8fafc" class="font-mono" font-size="17" font-weight="600">14,285 m²</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 316)">
      <rect width="210" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="24" fill="#cbd5e1" class="font-mono" font-size="10" font-weight="600">CENTER COORDINATE</text>
      <text x="14" y="48" fill="#f8fafc" class="font-mono" font-size="17" font-weight="600">E 664,250</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(222, 316)">
      <rect width="210" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="24" fill="#cbd5e1" class="font-mono" font-size="10" font-weight="600">GNSS BASELINE FIX</text>
      <text x="14" y="48" fill="#10b981" class="font-mono" font-size="17" font-weight="600">± 0.012 m</text>
    </g>

    <!-- CTA & Footer Stamp -->
    <g transform="translate(0, 470)">
      <rect width="180" height="46" rx="6" fill="#f59e0b"/>
      <text x="90" y="28" fill="#090d16" class="font-sans" font-size="13" font-weight="700" text-anchor="middle">Explore Map Canvas</text>
      <text x="204" y="28" fill="#cbd5e1" class="font-mono" font-size="11">Scale 1:2,500</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="520" y1="0" x2="520" y2="630" stroke="#1e293b" stroke-width="1"/>

  <!-- Right Map Canvas Viewport -->
  <g transform="translate(520, 0)">
    <rect width="680" height="630" fill="url(#mapGlow)"/>

    <!-- Map Grid -->
    <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
      <line x1="40" y1="80" x2="640" y2="80"/>
      <line x1="40" y1="200" x2="640" y2="200"/>
      <line x1="40" y1="320" x2="640" y2="320"/>
      <line x1="40" y1="440" x2="640" y2="440"/>
      <line x1="40" y1="560" x2="640" y2="560"/>

      <line x1="120" y1="40" x2="120" y2="590"/>
      <line x1="260" y1="40" x2="260" y2="590"/>
      <line x1="400" y1="40" x2="400" y2="590"/>
      <line x1="540" y1="40" x2="540" y2="590"/>
    </g>

    <!-- Background Cadastral Lots -->
    <polygon points="60,80 230,110 210,260 50,220" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="1.5"/>
    <text x="120" y="175" fill="#94a3b8" class="font-mono" font-size="12">Lot 108</text>

    <polygon points="230,110 440,90 460,250 210,260" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="1.5"/>
    <text x="320" y="175" fill="#94a3b8" class="font-mono" font-size="12">Lot 109</text>

    <polygon points="50,220 210,260 190,460 40,430" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="355" fill="#94a3b8" class="font-mono" font-size="12">Lot 110</text>

    <!-- Main Target Cadastral Parcel -->
    <polygon points="210,260 460,250 520,450 360,520 190,460" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Boundary Measurements -->
    <text x="320" y="240" fill="#22d3ee" class="font-mono" font-size="12" font-weight="600">84.22 m</text>
    <text x="500" y="350" fill="#22d3ee" class="font-mono" font-size="12" font-weight="600">62.15 m</text>
    <text x="430" y="500" fill="#22d3ee" class="font-mono" font-size="12" font-weight="600">54.80 m</text>
    <text x="260" y="505" fill="#22d3ee" class="font-mono" font-size="12" font-weight="600">60.10 m</text>
    <text x="180" y="365" fill="#22d3ee" class="font-mono" font-size="12" font-weight="600">68.35 m</text>

    <!-- Boundary Vertices -->
    <g fill="#0f172a" stroke="#22d3ee" stroke-width="2.5">
      <circle cx="210" cy="260" r="6"/>
      <circle cx="460" cy="250" r="6"/>
      <circle cx="520" cy="450" r="6"/>
      <circle cx="360" cy="520" r="6"/>
      <circle cx="190" cy="460" r="6"/>
    </g>
    <g fill="#f8fafc" class="font-mono" font-size="10" font-weight="600">
      <text x="218" y="255">P-1</text>
      <text x="468" y="245">P-2</text>
      <text x="528" y="455">P-3</text>
      <text x="368" y="535">P-4</text>
      <text x="168" y="475">P-5</text>
    </g>

    <!-- Parcel Tag -->
    <rect x="290" y="340" width="140" height="56" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="306" y="363" fill="#f59e0b" class="font-mono" font-size="13" font-weight="700">PARCEL 4196</text>
    <text x="306" y="382" fill="#cbd5e1" class="font-mono" font-size="11">14,285.4 m²</text>

    <!-- North Arrow -->
    <g transform="translate(610, 80)">
      <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <polygon points="0,-16 5,-3 0,0 -5,-3" fill="#f59e0b"/>
      <polygon points="0,16 5,3 0,0 -5,3" fill="#64748b"/>
      <text x="-5" y="-21" fill="#f8fafc" class="font-sans" font-size="11" font-weight="800">N</text>
    </g>
  </g>
</svg>
