<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invalid Fixture: MD104 Raw 100vh Without Dynamic Viewport</title>
  <style>
    body {
      background: #111;
      color: #eee;
      /* VIOLATION MD104: Raw 100vh without 100dvh causes mobile address-bar jumpiness */
      height: 100vh;
      margin: 0;
    }

    button {
      min-width: 44px;
      min-height: 44px;
      cursor: pointer;
    }

    button:hover { background: #333; }
    button:active { transform: scale(0.98); }

    button:focus-visible {
      outline: 2px solid #00f;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <button type="button">Valid Button</button>
</body>
</html>
