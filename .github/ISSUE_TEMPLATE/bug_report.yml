name: "Bug Report"
description: "File a bug or issue with ME-DESIGN CLI, linter, or skill router"
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When running `medesign polish` on a file containing..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps or minimal HTML/CSS snippet to reproduce the behavior."
      placeholder: |
        1. Run 'medesign lint example.html'
        2. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options:
        - "Node.js 22.x"
        - "Node.js 20.x"
        - "Node.js 18.x"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Additional Context / Logs"
      description: "Paste command output, error traces, or SARIF output here."
